[Service]
# Antes de arrancar Umbriel se revisa ~/.config/umbriel/config.toml. Si un
# escritor la dejó sin [general] autostart, el compositor arrancaría sin el
# shell y el escritorio quedaría negro. El guion inicial hace que un fallo del
# guardián nunca impida arrancar el compositor.
ExecStartPre=-%h/.local/bin/umbriel-config-guard ensure
