# Tono del desenfoque de Umbriel.
#
# Se aplica al cambiar entre modo oscuro y claro con shell-umbriel-theme; no
# hace falta recompilar. Para probar un cambio sin cambiar de tema:
#
#   shell-glass tone dark
#   shell-glass tone light
#
# brightness, contrast y saturation usan la misma escala que Umbriel (0-2).
# En oscuro se baja el brillo para que el cristal no se vea lavado; en claro
# se sube un poco para conservar la luminosidad. passes controla las pasadas
# del desenfoque (0-8): más pasadas suavizan más, con más coste de GPU.

DARK_BRIGHTNESS=0.72
DARK_CONTRAST=0.92
DARK_SATURATION=1.06
LIGHT_BRIGHTNESS=1.08
LIGHT_CONTRAST=0.95
LIGHT_SATURATION=1.02
BLUR_PASSES=3
