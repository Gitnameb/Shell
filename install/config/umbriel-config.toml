# Shell · configuración de Umbriel
#
# Umbriel aporta la decoración nativa: la barra de título forma parte de la
# ventana y reserva su altura, así que el contenido nunca queda debajo.
# Quickshell sigue siendo el shell (barra, paneles, centro de control, OSD).
#
# Validar después de editar:
#   umbriel config validate -c ~/.config/umbriel/config.toml

[general]
# Arranca el shell dentro de la sesión de Umbriel. El script exporta el tema de
# Qt y el tema de iconos antes de lanzar Quickshell.
autostart = ["/home/USUARIO/.local/bin/shell-start"]
xwayland = true
# El escritorio imita el mockup, sin una hoja de atajos encima al arrancar.
# Se puede abrir a demanda con Mod+F1.
show_cheatsheet = false

[layout]
# Mosaico por defecto: el escritorio 1 y los nuevos reparten las ventanas.
# «Configuración de ventanas» guarda abajo las excepciones (el 2 en ventana).
mode = "dwindle"
gap = 8
client_maximize = "edges"

[layout.stacking]
drop_zones = true

default_width_fraction = 0.60
default_height_fraction = 0.60
cascade_step = 0

[animation]
# Velocidad global de las transiciones nativas. 2.0 tarda la mitad; el shell
# lo ajusta desde «Ajustes del shell» y lo mantiene al día.
speed = 2.0

[appearance]
# Decoración del compositor, no una capa encima del contenido.
prefer_no_csd = true
border_width = 1
outer_border_width = 0
corner_radius = 14
drag_opacity = 0.85

[appearance.title_bar]
# Superpuesta: no reserva espacio y solo aparece mientras se mantiene Mod.
overlay = true
# «forced»: siempre hay barra, incluso si la app pide decoración propia.
# Así el escritorio se comporta como Windows desde el primer arranque.
mode = "forced"
height = 36
font = "sans 11"
button_position = "right"
# Del título hacia fuera: volumen, flotar, fijar, pantalla completa, mover
# (abre la vista general), minimizar, maximizar y cerrar. Los botones nuevos
# son del fork del shell.
buttons = ["volume", "float", "pin", "fullscreen", "move", "minimize", "maximize", "close"]
button_corner_radius = 6
button_glyph = "always"
button_background = true

[appearance.blur]
enabled = true
optimized = true
radius = 16
passes = 3
brightness = 0.720
contrast = 0.920
saturation = 1.060

[appearance.shadow]
enabled = true
softness = 12
offset_x = 2
offset_y = 3

[colors]
background = "#141519FF"
text_primary = "#e8eaedFF"
text_muted = "#8a8f98FF"
accent_primary = "#8ab4f8FF"
accent_secondary = "#8ab4f8FF"

[colors.border]
focused = "#8ab4f8FF"
unfocused = "#2a2d33FF"
outer = "#1a1c20FF"

[colors.title_bar]
background = "#1a1c20FF"
background_unfocused = "#141519FF"
text = "#e8eaedFF"
text_unfocused = "#8a8f98FF"
close = "#e06c75FF"
close_glyph = "#141519FF"
close_glyph_hover = "#141519FF"
maximize = "#b8bec7FF"
maximize_glyph = "#141519FF"
maximize_glyph_hover = "#141519FF"
minimize = "#f5c96bFF"
minimize_glyph = "#141519FF"
minimize_glyph_hover = "#141519FF"

# ---------------------------------------------------------------------------
# Atajos. Definir esta tabla sustituye los atajos del ejemplo empaquetado, así
# que aquí están todos los que el shell necesita.
# ---------------------------------------------------------------------------
[keybinds]

# Shell
# El shell decide con el evento `modifiers` si el gesto fue un toque limpio.
# No se añade un bind suelto para `Mod`: ese bind y el evento se ejecutaban a
# la vez y podían abrir o cerrar el cajón dos veces.
"Mod+Space" = { action = "spawn qs ipc -c shell call launcher toggle", repeat = false }
"Mod+N" = { action = "spawn qs ipc -c shell call notifications toggle", repeat = false }
"Mod+Shift+N" = { action = "spawn qs ipc -c shell call notifications dnd", repeat = false }
"Mod+C" = { action = "spawn qs ipc -c shell call calendar toggle", repeat = false }
"Mod+V" = { action = "spawn qs ipc -c shell call notifications clipboard", repeat = false }
"Mod+Shift+W" = { action = "spawn qs ipc -c shell call windows toggleFocused", repeat = false }
"Mod+Tab" = "overview-toggle"
"Mod+Shift+Tab" = { action = "spawn qs ipc -c shell call windows pinned", repeat = false }
"Mod+F1" = "cheatsheet-toggle"
"Mod+Shift+M" = { action = "spawn qs ipc -c shell call notifications micToggle", repeat = false }
"Mod+Escape" = "session-quit"
"Mod+Shift+L" = { action = "spawn ~/.local/bin/shell-lock", repeat = false }

# Aplicaciones y ventanas
"Mod+Return" = { action = "spawn foot", repeat = false }
"Mod+Q" = { action = "window-close", repeat = false }
"Mod+T" = { action = "window-toggle-floating", repeat = false }
"Mod+P" = { action = "window-toggle-pinned", repeat = false }
"Mod+M" = { action = "window-toggle-maximize", repeat = false }
"Mod+Shift+H" = { action = "window-minimize", repeat = false }
"Mod+F" = { action = "window-toggle-fullscreen", repeat = false }

# Escritorios
"Mod+1" = "workspace-switch 1"
"Mod+2" = "workspace-switch 2"
"Mod+3" = "workspace-switch 3"
"Mod+4" = "workspace-switch 4"
"Mod+5" = "workspace-switch 5"
"Mod+6" = "workspace-switch 6"
"Mod+7" = "workspace-switch 7"
"Mod+8" = "workspace-switch 8"
"Mod+9" = "workspace-switch 9"
"Mod+Shift+1" = "window-move-to-workspace 1"
"Mod+Shift+2" = "window-move-to-workspace 2"
"Mod+Shift+3" = "window-move-to-workspace 3"
"Mod+Shift+4" = "window-move-to-workspace 4"
"Mod+Shift+5" = "window-move-to-workspace 5"
"Mod+Shift+6" = "window-move-to-workspace 6"
"Mod+Shift+7" = "window-move-to-workspace 7"
"Mod+Shift+8" = "window-move-to-workspace 8"
"Mod+Shift+9" = "window-move-to-workspace 9"

# Enfoque y tamaño
"Mod+Left" = "window-focus-left"
"Mod+Right" = "window-focus-right"
"Mod+Up" = "window-focus-up"
"Mod+Down" = "window-focus-down"
"Mod+H" = "window-focus-left"
"Mod+J" = "window-focus-down"
"Mod+K" = "window-focus-up"
"Mod+L" = "window-focus-right"
"Mod+R" = "window-cycle-primary-extent"
"Mod+Shift+R" = "window-cycle-primary-extent-back"

# Audio y brillo
"XF86AudioRaiseVolume" = { action = "spawn wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%+", allow_when_locked = true }
"XF86AudioLowerVolume" = { action = "spawn wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%-", allow_when_locked = true }
"XF86AudioMute" = { action = "spawn wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle", allow_when_locked = true, repeat = false }
"XF86MonBrightnessUp" = { action = "spawn qs ipc -c shell call notifications brightnessUp", allow_when_locked = true }
"XF86MonBrightnessDown" = { action = "spawn qs ipc -c shell call notifications brightnessDown", allow_when_locked = true }

[input.keyboard]
layout = "es"

# Nueve escritorios fijos, como los muestra el shell. En modo dinámico solo existían
# dos o tres, así que `workspace-switch 9` y «Mover a escritorio 9» acababan en
# el último disponible (2 o 3). Si cambia el monitor o se instala en un portátil,
# hay que repetir esta sección con el conector correspondiente (`eDP-1`, etc.).
[output."HDMI-A-1"]
workspaces = 9

# El puente de captura X11 (Discord, Zoom y demás apps X11) no necesita una
# ventana visible. Se guarda en el scratchpad y sigue funcionando en segundo
# plano; se puede sacar con Mod+` si alguna vez hace falta.
[[window_rule]]
match.app_id = "^xwaylandvideobridge$"
default_scratchpad = "default"

[display]
brightness = 1.000
extra_dim = 0.000
warm = 0.000

[input]
mod_hold_delay_ms = 320

# shell-workspace-modes: inicio
# Generado desde «Configuración de ventanas»; no editar a mano.

[[workspace]]
index = 2
layout.mode = "stacking"

# shell-workspace-modes: fin

# shell-glass: inicio
# Cristal del shell. Umbriel desenfoca las superficies transparentes. Con
# blur_optimized = true muestrea la caché del fondo de pantalla y los paneles
# nunca desenfocan las ventanas; con false desenfoca el contenido real.
# blur_ignore_alpha descarta los píxeles transparentes de las esquinas
# redondeadas para que el desenfoque no asome fuera de la superficie.
# blur_strength escala el radio global para que el shell tenga el suyo.
[[layer_rule]]
match.namespace = "^shell-(bar|side-panel|launcher|calendar|battery|tray|power|app-menu|osd|welcome-mode|notification-popup)$"
blur = true
blur_popups = true
blur_ignore_alpha = 0.04
blur_optimized = true
blur_strength = 1.0000

# Superficies transparentes a pantalla completa o que no son cristal: no
# deben crear una región de desenfoque.
[[layer_rule]]
match.namespace = "^shell-(wallpaper|desktop-icons|outside-close|filter)$"
blur = false
# shell-glass: fin
