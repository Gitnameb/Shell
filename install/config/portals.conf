[preferred]
# Umbriel implementa ScreenCast y Screenshot, pero no el diálogo de permiso
# (org.freedesktop.impl.portal.Access). Sin un backend para Access,
# xdg-desktop-portal se queda esperando y la captura o el uso compartido
# terminan en «Failed to show access dialog: Timeout was reached». GTK sí lo
# implementa y ya corre en la sesión; el resto de portales sigue eligiéndose
# automáticamente por UseIn.
org.freedesktop.impl.portal.Access=gtk
