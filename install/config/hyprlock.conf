# Pantalla de bloqueo del shell.
#
# La usa hyprlock. Si este archivo no existe, scripts/shell-lock crea una
# copia mínima a partir de esta misma plantilla. Se puede personalizar sin
# miedo: solo afecta a la pantalla de bloqueo.

background {
    monitor =
    color = rgb(12, 14, 18)
}

label {
    monitor =
    text = $TIME
    color = rgb(240, 244, 250)
    font_size = 56
    position = 0, -60
    halign = center
    valign = center
}

label {
    monitor =
    text = Sesión bloqueada
    color = rgb(150, 160, 175)
    font_size = 16
    position = 0, 10
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 240, 44
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.4
    dots_center = true
    outer_color = rgb(138, 180, 248)
    inner_color = rgb(22, 26, 32)
    font_color = rgb(240, 244, 250)
    placeholder_text = Contraseña
    position = 0, 80
    halign = center
    valign = center
}
